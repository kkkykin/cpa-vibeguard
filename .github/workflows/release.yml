name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute release version
        id: version
        run: |
          set -euo pipefail
          base_version="$(jq -er '.plugins[] | select(.id == "cpa-vibeguard") | .version' registry.json)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${base_version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA:0:7}"
          printf 'version=%s\ntag=v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"

      - name: Test and build release library
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make check
          python3 tests/integration/native_smoke.py dist/cpa-vibeguard.so "$VERSION"

      - name: Package plugin store assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          library = Path("dist/cpa-vibeguard.so")
          archive = Path(f"dist/cpa-vibeguard_{os.environ['VERSION']}_linux_amd64.zip")
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as bundle:
              bundle.write(library, arcname=library.name)
          with ZipFile(archive) as bundle:
              assert bundle.namelist() == [library.name]
              assert bundle.testzip() is None
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path("dist/checksums.txt").write_text(f"{digest}  {archive.name}\n")
          PY
          (cd dist && sha256sum --check checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automated build from commit ${GITHUB_SHA}.

          Platform: Linux/amd64 (glibc), built on Ubuntu 22.04.
          The ZIP contains cpa-vibeguard.so at its root; checksums.txt contains its SHA-256 checksum.
          EOF

          # Upload everything to a draft before exposing it to the plugin store.
          gh release create "$RELEASE_TAG" \
            "dist/cpa-vibeguard_${VERSION}_linux_amd64.zip" \
            dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "cpa-vibeguard $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
