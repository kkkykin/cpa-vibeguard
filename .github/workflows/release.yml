name: Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    concurrency:
      group: cpa-vibeguard-verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute release version
        id: version
        run: |
          set -euo pipefail
          base_version="$(jq -er '.plugins[] | select(.id == "cpa-vibeguard") | .version' registry.json)"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${base_version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.g${GITHUB_SHA:0:7}"
          artifact="release-assets.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          printf 'version=%s\ntag=v%s\nartifact=%s\n' "$version" "$version" "$artifact" >> "$GITHUB_OUTPUT"

      - name: Test and build release library
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          make check integration vuln release-check
          python3 tests/integration/native_smoke.py dist/cpa-vibeguard.so "$VERSION"

      - name: Package plugin store assets
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          library = Path("dist/cpa-vibeguard.so")
          archive = Path(f"dist/cpa-vibeguard_{os.environ['VERSION']}_linux_amd64.zip")
          with ZipFile(archive, "w", compression=ZIP_DEFLATED) as bundle:
              bundle.write(library, arcname=library.name)
          with ZipFile(archive) as bundle:
              assert bundle.namelist() == [library.name]
              assert bundle.testzip() is None
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path("dist/checksums.txt").write_text(f"{digest}  {archive.name}\n")
          PY
          (cd dist && sha256sum --check checksums.txt)

      - name: Save verified release assets
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/cpa-vibeguard_${{ steps.version.outputs.version }}_linux_amd64.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: cpa-vibeguard-publish
      cancel-in-progress: false
    steps:
      - name: Check out verified source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: dist

      - name: Publish stable or preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd dist && sha256sum --check checksums.txt)
          python3 scripts/publish_release.py
