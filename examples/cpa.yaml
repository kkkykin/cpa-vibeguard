host: "127.0.0.1"
port: 8317
auth-dir: "./auths"
api-keys:
  - "replace-with-your-client-key"
plugins:
  enabled: true
  dir: "./dist"
  configs:
    cpa-vibeguard:
      enabled: true
      priority: 100
      on_unknown_api: reject
      on_request_error: reject
      preserve_marker_hint: false
      bypass:
        headers:
          - name: X-Vibeguard-Skip
            value: "true"
